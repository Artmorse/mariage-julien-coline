name: Déploiement

# Le site est publié automatiquement à chaque arrivée de code sur main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Compilation
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      NODE_VERSION: 22.16.0
      TZ: Europe/Paris
    steps:
      - name: Récupération des sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configuration de GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Installation de Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation de Hugo
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "$GITHUB_PATH"

      - name: Versions des outils
        run: |
          hugo version
          node --version

      - name: Installation des dépendances Node.js
        run: npm ci

      # Le cache accélère surtout le redimensionnement des photographies,
      # qui représente l'essentiel du temps de compilation.
      - name: Restauration du cache Hugo
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      # baseURL n'est pas surchargée : elle vient de hugo.toml et correspond
      # au domaine personnalisé déclaré dans static/CNAME.
      - name: Compilation du site
        run: |
          hugo build \
            --gc \
            --minify \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Sauvegarde du cache Hugo
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Publication de l'artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    name: Mise en ligne
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
