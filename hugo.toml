baseURL = 'https://julien-coline.lemorse.tech/'
locale = 'fr-FR'
defaultContentLanguage = 'fr'
title = 'Coline & Julien'

enableRobotsTXT = true
enableInlineShortcodes = true

# The site is private: no feeds, no sitemap, no indexing. The 404 page stays
# enabled: GitHub Pages serves /404.html on every unknown URL.
disableKinds = ['taxonomy', 'term', 'RSS', 'sitemap']

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = 'assets/css'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
    disableWatch = true

[markup.goldmark.renderer]
  unsafe = true

# Navigation. The order defined here drives both the menu and the "next page"
# link at the bottom of every page.
[[menus.main]]
  name = 'Accueil'
  pageRef = '/'
  weight = 10
[[menus.main]]
  name = 'Programme'
  pageRef = '/schedule'
  weight = 20
[[menus.main]]
  name = 'Lieu'
  pageRef = '/venue'
  weight = 30
[[menus.main]]
  name = 'Dress code'
  pageRef = '/dress-code'
  weight = 40
[[menus.main]]
  name = 'RSVP'
  pageRef = '/rsvp'
  weight = 50
[[menus.main]]
  name = 'Playlist'
  pageRef = '/playlist'
  weight = 60
[[menus.main]]
  name = 'Photos'
  pageRef = '/photos'
  weight = 70

[minify]
  disableXML = true

[params]
  # ---------------------------------------------------------------------------
  # The couple
  # ---------------------------------------------------------------------------
  brideFirstName = 'Coline'
  groomFirstName = 'Julien'
  brideFullName = 'Coline Metta-Versmessen'
  groomFullName = 'Julien Méreau'
  marriedName = 'Coline Méreau-Versmessen'

  # ---------------------------------------------------------------------------
  # Dates — ISO format for <time> tags, long format for display
  # ---------------------------------------------------------------------------
  civilDate = '2026-03-28'
  weddingDate = '2027-08-07'
  weddingDateLong = '7 août 2027'
  weekendLong = 'Le samedi 7 août 2027'

  # ---------------------------------------------------------------------------
  # Venue
  # ---------------------------------------------------------------------------
  [params.venue]
    name = 'Maison Familiale de Berlencourt-Le-Cauroy'
    shortName = 'Berlencourt-le-Cauroy'
    street = '161 Rue de Grand Rullecourt'
    postcode = '62810'
    city = 'Berlencourt-le-Cauroy'
    mapsUrl = 'https://maps.app.goo.gl/6Cfe8bpqcX1J4paj7'

  # ---------------------------------------------------------------------------
  # External links
  #
  # Leaving a value empty ('') simply hides the matching button: the page stays
  # online with its text, without a dead link for the guests.
  # Replace with the real URL as soon as it is available.
  # ---------------------------------------------------------------------------
  [params.links]
    rsvp = ''       # Google Forms — TODO: form still to be created
    playlist = ''   # Collaborative Spotify playlist — TODO
    photos = ''     # Google Photos album — TODO

  # ---------------------------------------------------------------------------
  # Images (paths relative to assets/)
  # ---------------------------------------------------------------------------
  [params.images]
    couple = 'images/couple-civil-wedding.jpg'
    family = 'images/family-civil-wedding.jpg'
    schedule = ''   # Schedule image — TODO: drop it into assets/images/
